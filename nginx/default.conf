# Upstream service targets (defined by Docker container network names)
upstream portfolio_upstream {
    server portfolio-frontend:80;
}

upstream clouddrive_upstream {
    server clouddrive-backend:8080;
}

# 1. Main Portfolio (Apex & WWW)
server {
    listen 80;
    server_name raheemcloud.tech www.raheemcloud.tech localhost;

    location / {
        proxy_pass http://portfolio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. CloudDrive Subdomain
server {
    listen 80;
    server_name drive.raheemcloud.tech;

    location / {
        proxy_pass http://clouddrive_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}